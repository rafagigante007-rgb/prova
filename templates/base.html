<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Produtos</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .navbar {
            background: linear-gradient(135deg, #0d1b2a, #1b263b) !important;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background-color: #1d3557;
            border-color: #1d3557;
        }
        .btn-primary:hover {
            background-color: #0f172a;
            border-color: #0f172a;
        }
        .card-custom {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <!-- Barra de Navegação Estilizada -->
    <nav class="navbar navbar-dark mb-4 py-3">
        <div class="container">
            <a class="navbar-brand text-info" href="{{ url_for('index') }}">
                 Lojão do Rafinha
            </a>
            <a class="btn btn-primary px-4 shadow-sm" href="{{ url_for('cadastrar') }}">
                + Novo Produto
            </a>
        </div>
    </nav>

    <!-- Container Principal -->
    <div class="container">
        <!-- Mensagens Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Conteúdo Dinâmico -->
        <div class="card card-custom p-4 bg-white">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>

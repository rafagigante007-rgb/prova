{% extends 'base.html' %}

{% block content %}
<h2>{% if produto %}Editar Produto{% else %}Cadastrar Produto{% endif %}</h2>

<form method="POST" enctype="multipart/form-data" class="mt-3">
    <div class="mb-3">
        <label class="form-label">Nome do Produto</label>
        <input type="text" name="nome" class="form-control" value="{{ produto.nome if produto else '' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Preço (R$)</label>
        <input type="number" step="0.01" name="preco" class="form-control" value="{{ produto.preco if produto else '' }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Categoria</label>
        <select name="categoria_id" class="form-select" required>
            <option value="">Selecione uma categoria...</option>
            {% for c in categorias %}
                <option value="{{ c.id }}" {% if produto and produto.categoria_id == c.id %}selected{% endif %}>
                    {{ c.nome }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Imagem do Produto</label>
        <input type="file" name="imagem" class="form-control" accept="image/*">
        {% if produto and produto.imagem %}
            <small class="text-muted">Foto atual: {{ produto.imagem }}</small>
        {% endif %}
    </div>

    <button type="submit" class="btn btn-success">Salvar</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}

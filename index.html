{% extends 'base.html' %}

{% block content %}
    <form action="/salvar" method="POST" enctype="multipart/form-data">
        <h3>Cadastrar Produto</h3>
        <input type="text" name="nome" placeholder="Nome do produto">
        <input type="number" step="0.01" name="preco" placeholder="Preço">
        <input type="file" name="foto" accept="image/*">
        <button type="submit">Salvar</button>
    </form>

    <form action="/" method="GET">
        <input type="text" name="busca" placeholder="Pesquisar por nome..." value="{{ busca }}">
        <button type="submit">Buscar</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>Foto</th>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for p in produtos %}
            <tr>
                <td><img src="{{ url_for('static', filename='uploads/' + p.imagem) }}"></td>
                <td>{{ p.id }}</td>
                <td>{{ p.nome }}</td>
                <td>R$ {{ "%.2f"|format(p.preco) }}</td>
                <td>
                    <a href="/excluir/{{ p.id }}">Excluir</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
